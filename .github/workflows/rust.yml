name: Rust tests
on:
  push: null
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-check
      run: echo stepify-probe-check
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Check Rita and Rita Exit x86
      run: cargo check --all
    - name: stepify-tail-check
      run: echo stepify-tail-check
      id: _bre_check
    - name: stepify-probe-test
      run: echo stepify-probe-test
    - uses: Swatinem/rust-cache@v2
    - name: Run Rita and Rita Exit tests
      run: cargo test --verbose --all
    - name: stepify-tail-test
      run: echo stepify-tail-test
      id: _bre_test
    - name: stepify-probe-rustfmt
      run: echo stepify-probe-rustfmt
      if: '!cancelled() && steps._bre_check.conclusion == ''success'''
      id: _m_rustfmt
    - name: Check code formatting
      run: rustup component add rustfmt && cargo fmt --all -- --check
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_rustfmt.conclusion !=
        ''failure'''
      id: _m_rustfmt_1
    - name: stepify-tail-rustfmt
      run: echo stepify-tail-rustfmt
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_rustfmt.conclusion !=
        ''failure'' && steps._m_rustfmt_1.conclusion != ''failure'''
    - name: stepify-probe-clippy
      run: echo stepify-probe-clippy
      if: '!cancelled() && steps._bre_check.conclusion == ''success'''
      id: _m_clippy
    - uses: Swatinem/rust-cache@v2
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_clippy.conclusion !=
        ''failure'''
      id: _m_clippy_1
    - name: Check for Clippy lints
      run: rustup component add clippy && cargo clippy --all --all-targets --all-features -- -D warnings
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_clippy.conclusion !=
        ''failure'' && steps._m_clippy_1.conclusion != ''failure'''
      id: _m_clippy_2
    - name: stepify-tail-clippy
      run: echo stepify-tail-clippy
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_clippy.conclusion !=
        ''failure'' && steps._m_clippy_1.conclusion != ''failure'' && steps._m_clippy_2.conclusion !=
        ''failure'''
    - name: stepify-probe-audit
      run: echo stepify-probe-audit
      if: '!cancelled() && steps._bre_check.conclusion == ''success'''
      id: _m_audit
    - name: stepify-fault-audit
      run: exit 1
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_audit.conclusion !=
        ''failure'''
      id: _m_audit_1
    - uses: Swatinem/rust-cache@v2
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_audit.conclusion !=
        ''failure'' && steps._m_audit_1.conclusion != ''failure'''
      id: _m_audit_2
    - name: Run Cargo Audit
      run: cargo install cargo-audit && cargo audit
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_audit.conclusion !=
        ''failure'' && steps._m_audit_1.conclusion != ''failure'' && steps._m_audit_2.conclusion != ''failure'''
      id: _m_audit_3
    - name: stepify-tail-audit
      run: echo stepify-tail-audit
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_audit.conclusion !=
        ''failure'' && steps._m_audit_1.conclusion != ''failure'' && steps._m_audit_2.conclusion != ''failure''
        && steps._m_audit_3.conclusion != ''failure'''
    - name: stepify-probe-integration-test-five-nodes
      run: echo stepify-probe-integration-test-five-nodes
      if: '!cancelled() && steps._bre_check.conclusion == ''success'''
      id: _m_integration_test_five_nodes
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_integration_test_five_nodes.conclusion
        != ''failure'''
      id: _m_integration_test_five_nodes_1
    - name: Run integration test
      run: bash scripts/integration_tests/all-up-test-ci.sh FIVE_NODES
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_integration_test_five_nodes.conclusion
        != ''failure'' && steps._m_integration_test_five_nodes_1.conclusion != ''failure'''
      id: _m_integration_test_five_nodes_2
    - name: stepify-tail-integration-test-five-nodes
      run: echo stepify-tail-integration-test-five-nodes
      if: '!cancelled() && steps._bre_check.conclusion == ''success'' && steps._m_integration_test_five_nodes.conclusion
        != ''failure'' && steps._m_integration_test_five_nodes_1.conclusion != ''failure'' && steps._m_integration_test_five_nodes_2.conclusion
        != ''failure'''
    - name: stepify-probe-integration-test-althea-payment
