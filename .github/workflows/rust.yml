name: Rust tests
on:
  push: null
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-check
      run: echo stepify-probe-check
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Check Rita and Rita Exit x86
      run: cargo check --all
    - name: stepify-tail-check
      run: echo stepify-tail-check
  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-test
      run: echo stepify-probe-test
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Run Rita and Rita Exit tests
      run: cargo test --verbose --all
    - name: stepify-tail-test
      run: echo stepify-tail-test
  rustfmt:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-rustfmt
      run: echo stepify-probe-rustfmt
    - uses: actions/checkout@v2
    - name: Check code formatting
      run: rustup component add rustfmt && cargo fmt --all -- --check
    - name: stepify-tail-rustfmt
      run: echo stepify-tail-rustfmt
  clippy:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-clippy
      run: echo stepify-probe-clippy
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Check for Clippy lints
      run: rustup component add clippy && cargo clippy --all --all-targets --all-features -- -D warnings
    - name: stepify-tail-clippy
      run: echo stepify-tail-clippy
  audit:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-audit
      run: echo stepify-probe-audit
    - name: stepify-fault-audit
      run: exit 1
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Run Cargo Audit
      run: cargo install cargo-audit && cargo audit
    - name: stepify-tail-audit
      run: echo stepify-tail-audit
  cross-aarch64:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-cross-aarch64
      run: echo stepify-probe-cross-aarch64
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Cross test aarch64
      run: cargo install cross && cross build --target aarch64-unknown-linux-musl --verbose -p rita_bin
        --bin rita
    - name: stepify-tail-cross-aarch64
      run: echo stepify-tail-cross-aarch64
  cross-armv7:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-cross-armv7
      run: echo stepify-probe-cross-armv7
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
    - name: Cross test armv7
      run: cargo install cross && cross build --target armv7-unknown-linux-musleabihf --verbose -p rita_bin
        --bin rita
    - name: stepify-tail-cross-armv7
      run: echo stepify-tail-cross-armv7
  integration-test-five-nodes:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-integration-test-five-nodes
      run: echo stepify-probe-integration-test-five-nodes
    - uses: actions/checkout@v2
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: Run integration test
      run: bash scripts/integration_tests/all-up-test-ci.sh FIVE_NODES
    - name: stepify-tail-integration-test-five-nodes
      run: echo stepify-tail-integration-test-five-nodes
  integration-test-althea-payment:
