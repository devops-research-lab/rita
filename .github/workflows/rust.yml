        != ''failure'' && steps._m_integration_test_cgnat_exit_1.conclusion != ''failure'' && steps._m_integration_test_cgnat_exit_2.conclusion
        != ''failure'''
    - name: stepify-probe-cross-aarch64
      run: echo stepify-probe-cross-aarch64
      if: '!cancelled() && steps._bre_test.conclusion == ''success'''
